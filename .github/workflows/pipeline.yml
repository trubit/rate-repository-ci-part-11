name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - name: Run npm test
        run: npm test
      - name: Run npm build
        run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Trigger deployment
        if: ${{ github.event_name == 'push' }}
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOKS }}
        run: |
          # strip accidental quotes and whitespace from the secret value
          HOOK=$(printf '%s' "$DEPLOY_HOOK" | tr -d '"' | tr -d "'" | tr -d '[:space:]')
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOKS secret is empty or not visible to this workflow."
            exit 1
          fi
          case "$HOOK" in
            https://*) ;;
            *)
              echo "::error::RENDER_DEPLOY_HOOKS value is not a URL. Paste only the deploy hook URL from Render (https://api.render.com/deploy/srv-...)."
              exit 1
              ;;
          esac
          curl --fail-with-body "$HOOK"
      - name: Check deployment health
        run: |
          echo "Waiting for the new version to be live on Render..."
          sleep 60
          curl --fail --retry 10 --retry-delay 30 --retry-all-errors \
            https://pokedex-trubit.onrender.com/health
          echo "Health check passed!"

  tag_release:
    needs: [simple_deployment_pipeline]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
